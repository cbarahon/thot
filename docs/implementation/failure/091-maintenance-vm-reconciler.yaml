id: "091-maintenance-vm-reconciler"
title: "Remove VMs unassigned to saved runs from the dedicated profile"
depends_on: ["090-maintenance-plan"]
file: "/home/carlos/worktrees/thot/crates/thot-engine/src/maintenance_vms.rs"
action: create
prompt: |-
  In `crates/thot-engine/src/maintenance_vms.rs`, define public `VmCleanupReport` with `unregistered_uuids`, `removed_storage_paths`, `preserved_paths`, `failed_manifest_dirs`, and `failures` string-vector fields. Implement async `clean_unassigned_vms(plan: &CleanPlan, runtime: &VmActivityRuntime) -> VmCleanupReport`, where `CleanPlan` supplies saved VM UUIDs and orphan manifests containing manifest path, report directory, delivery ID, and storage path. Run the configured `runtime.vbox_manage` with `VBOX_USER_HOME=runtime.vbox_user_home`; never inspect another VirtualBox profile. First call `vm_activity::cleanup_from_manifest` for each orphan manifest and record failures so those VMs are not retried by weaker checks. Then list VMs in the dedicated profile, preserve UUIDs in `plan.saved_vm_uuids`, and treat other entries as unassigned. Inspect each candidate's UUID, VM state, settings path, and disks. Gracefully request shutdown, wait up to `runtime.shutdown_grace`, force power off only if needed, verify it is powered off, then unregister it. Use `unregistervm UUID --delete` only if its settings and storage paths are under `runtime.storage_root` or are proven by a valid cleanup manifest; otherwise unregister without `--delete` and report the external files as preserved. Capture command failures per VM instead of aborting the full sweep. Add a file-purpose header comment. Edit only this file.
