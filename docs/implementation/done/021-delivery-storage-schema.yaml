prompt: |-
  Create a SQLite delivery repository module that connects to the configured database and initializes tables for delivery collections, deliveries, assessment runs, delivery expedients, individual test results, and artifact metadata. Include foreign keys, unique IDs, a uniqueness constraint preventing duplicate delivery execution within one run, and indexes for status/retrieval. Reuse the existing SQLx conventions. Do not implement student mapping tables. Edit only this file.
