id: "090-maintenance-plan"
title: "Plan cleanup of orphaned Thot data"
depends_on: []
file: "/home/carlos/worktrees/thot/crates/thot-engine/src/maintenance_plan.rs"
action: create
prompt: |-
  In `crates/thot-engine/src/maintenance_plan.rs`, define public `CleanupManifest`, `PlannedPath`, and `CleanPlan` types plus async `build_clean_plan(pool: &SqlitePool, artifact_root: &Path, storage_root: &Path) -> Result<CleanPlan, String>`. `CleanPlan` fields are `saved_run_ids: HashSet<String>`, `saved_vm_uuids: HashSet<String>`, `orphan_manifests: Vec<CleanupManifest>`, and `orphan_paths: Vec<PlannedPath>`. `CleanupManifest` fields are `manifest_path`, `report_dir`, `run_id`, `delivery_id`, `vm_uuid: Option<String>`, and `storage_path`; `PlannedPath` fields are `path` and `manifest_path: Option<PathBuf>`. Query the existing `vm_activity_runs`, `vm_activity_expedients`, and `vm_activity_deliveries` tables. Inventory `<artifact_root>/project-snapshots/<run_id>`, project report trees `<artifact_root>/<project_id>/<run_id>/<delivery_id>`, retained copies `<artifact_root>/sources/<delivery_id>.ova`, and default storage `<storage_root>/<run_id>/<delivery_id>`. Treat an item as orphaned if its run, expedient, or delivery ID is absent from matching database records. Scan `cleanup-manifest.json` files under artifact_root; retain valid manifests for saved expedients and classify manifests for absent runs/expedients as orphan manifests. Use `symlink_metadata`, do not follow symlinks, and canonicalize candidates to prove they remain under artifact_root or storage_root. External VM paths are manifest metadata for later validation, never direct deletion candidates. Do not include original project archives or delivery files. Add a file-purpose header comment. Edit only this file.
