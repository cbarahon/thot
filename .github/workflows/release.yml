name: Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(awk '/^\[workspace\.package\]$/ { in_workspace=1; next } /^\[/ { in_workspace=0 } in_workspace && /^version = / { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Workspace version must be stable MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${RELEASE_TAG} does not match workspace version v${version}" >&2
            exit 1
          fi

      - name: Build release binaries
        run: cargo build --release --locked -p thot-cli -p thotd

      - name: Package binaries and installer
        run: |
          set -eu
          package_dir="${RUNNER_TEMP}/thot-release"
          mkdir -p "${package_dir}" dist
          install -m 0755 target/release/thot "${package_dir}/thot"
          install -m 0755 target/release/thotd "${package_dir}/thotd"
          install -m 0644 deploy/thotd.service "${package_dir}/thotd.service"
          install -m 0644 deploy/thotd.env.example "${package_dir}/thotd.env.example"
          printf '%s\n' "${GITHUB_REF_NAME}" > "${package_dir}/VERSION"
          install -m 0755 deploy/install.sh dist/thot-install.sh
          tar -C "${package_dir}" -czf dist/thot-linux-x86_64-unknown-linux-gnu.tar.gz \
            thot thotd thotd.service thotd.env.example VERSION
          cd dist
          sha256sum thot-linux-x86_64-unknown-linux-gnu.tar.gz thot-install.sh > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/thot-linux-x86_64-unknown-linux-gnu.tar.gz \
            dist/thot-install.sh \
            dist/SHA256SUMS \
            --verify-tag --generate-notes --latest
