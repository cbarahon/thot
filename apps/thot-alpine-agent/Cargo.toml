[package]
name = "thot-alpine-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thot-alpine-agent"
path = "src/main.rs"

[dependencies]
thot-core = { path = "../../crates/thot-core" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "fs", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
libc = "0.2"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
ssh2 = "0.9.6"
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
serde_json_path = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }