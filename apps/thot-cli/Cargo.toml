[package]
name = "thot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thot"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
libc = "0.2"
thot-core = { path = "../../crates/thot-core" }
tokio.workspace = true
reqwest.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
flate2 = "1.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }

[dev-dependencies]
axum.workspace = true
thot-api = { path = "../../crates/thot-api" }
thot-engine = { path = "../../crates/thot-engine" }
tower = { version = "0.5", features = ["util"] }
