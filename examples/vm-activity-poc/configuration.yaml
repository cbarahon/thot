activity_name: The Linux Competition
delivery_folder: ./delivery
concurrency: 1
timeout: 120
tests:
  - name: import_ova
    test: VirtualBox/import_ova
    parameters:
      - vm_name: linux_competition
      - vbox_group: /linux_competition
      - vm_path: ./vms
  - name: start_time
    test: extern/tests/vm_start_time.py
    requirements: [import_ova]
    repeat: 3
    parameters:
      - vm_name: linux_competition
  - name: start_vm
    test: VirtualBox/start_vm
    requirements: [import_ova]
    parameters:
      - vm_name: linux_competition
  - name: vm_info
    test: ssh/get_host_info
    requirements: [start_vm]
    parameters:
      - host: 127.0.0.1
      - port: 2222
      - user: sysadmin
      - pass: Asdqwe!23
  - name: vm_stop
    test: VirtualBox/stop_vm
    requirements: [start_vm]
    parameters:
      - vm_name: linux_competition
  - name: vm_destroy
    test: VirtualBox/destroy_vm
    requirements: [import_ova]
    parameters:
      - vm_name: linux_competition
checks:
  - name: ova
    description: has delivered an ova and it can be imported
    check: pass
    test: import_ova
  - name: ssh
    description: vm has working ssh
    check: pass
    test: vm_info
  - name: ova_disk_size
    description: The disk size meets the technical requirement (1 Gb).
    check: regex_extract
    test: import_ova
    property: stdout
    parameters:
      - regex: 'vmdisk1\t([0-9]+)'
      - data_type: number
      - condition: '<='
      - value: 1073742000
  - name: ova_ram_size
    description: The imported VM has at most 260 MB of configured RAM.
    check: yaml_extract
    test: import_ova
    property: observation
    parameters:
      - JSONPath: $.vm_configuration.memory
      - data_type: number
      - condition: '<='
      - value: 260
  - name: fastest_boot
    description: Compare this delivery's boot time with the maximum observed boot time.
    check: stats/yaml_extract
    test: start_time_01
    property: stdout
    parameters:
      - JSONPath: $.elapsed_ms
      - data_type: number
      - stat: max
      - condition: '=='
  - name: fast_boot
    description: Boot time falls within the five-percentile threshold.
    check: stats/yaml_extract
    test: start_time_01
    property: stdout
    parameters:
      - JSONPath: $.elapsed_ms
      - data_type: number
      - stat: p5
      - condition: '<='
  - name: fast_boot_regex
    description: Compare boot time extracted from process output with the five-percentile threshold.
    check: stats/regex_extract
    test: start_time_01
    property: stdout
    parameters:
      - regex: '"elapsed_ms":\s*([0-9]+)'
      - data_type: number
      - stat: p5
      - condition: '<='
