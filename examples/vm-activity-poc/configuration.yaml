activity_name: The Linux Competition
delivery_folder: ./delivery
concurrency: 1
timeout: 120
tests:
  - name: import_ova
    test: VirtualBox/import_ova
    parameters:
      - vm_name: linux_competition
      - vbox_group: /linux_competition
      - vm_path: ./vms
      - filter_grep:
          - '(?m)^memory='
          - '^  vmdisk1\t'
          - '^Forwarding\('
  - name: start_time
    test: extern/tests/vm_start_time.py
    timeout: 480
    requirements: [import_ova]
    repeat: 3
    parameters:
      - vm_name: linux_competition
  - name: start_time_stats
    test: stats/yaml_extract
    parameters:
      - tests: [start_time]
      - property: stdout
      - JSONPath: $.elapsed_ms
  - name: start_vm
    test: VirtualBox/start_vm
    requirements: [import_ova]
    parameters:
      - vm_name: linux_competition
  - name: network_info
    test: network/nmap
    requirements: [start_vm]
    parameters:
      - host: 127.0.0.1
#     - ports: 22,80,443,2222,8080
      - exclude-ports: 22,8081
  - name: vm_info
    test: ssh/get_host_info
    requirements: [start_vm]
    parameters:
      - host: 127.0.0.1
      - port: 2222
      - user: tvadmin
      - pass: Asdqwe!23
  - name: vm_stop
    test: VirtualBox/stop_vm
    requirements: [start_vm]
    parameters:
      - vm_name: linux_competition
checks:
  - name: ova
    description: has delivered an ova and it can be imported
    check: pass
    test: import_ova
  - name: ssh
    description: vm has working ssh
    check: pass
    test: vm_info
  - name: http_forward_defined
    description: A NAT rule maps host port 8080 to guest port 80.
    check: regex_match
    test: import_ova
    property: stdout
    parameters:
      - regex: 'Forwarding\(\d+\)="[^"]*,tcp,,8080,,80"'
  - name: disk_size_ok
    description: The disk size meets the technical requirement (1 Gb).
    check: regex_extract
    test: import_ova
    property: stdout
    parameters:
      - regex: 'vmdisk1\t([0-9]+)'
      - data_type: number
      - condition: '<='
      - value: 1073742000
  - name: disk_size_small
    description: The disk size meets the technical requirement (2.5 Gb).
    check: regex_extract
    test: import_ova
    property: stdout
    parameters:
      - regex: 'vmdisk1\t([0-9]+)'
      - data_type: number
      - condition: '<='
      - value: 2600000000
  - name: ram_size_ok
    description: The imported VM has at most 260 MB of configured RAM.
    check: regex_extract
    test: import_ova
    property: stdout
    parameters:
      - regex: 'memory=([0-9]+)'
      - data_type: number
      - condition: '<='
      - value: 260
  - name: ram_size_small
    description: The imported VM has at most 512 MB of configured RAM.
    check: regex_extract
    test: import_ova
    property: stdout
    parameters:
      - regex: 'memory=([0-9]+)'
      - data_type: number
      - condition: '<='
      - value: 525
  - name: fastest_boot
    description: Compare this delivery's boot time with the maximum observed boot time.
    check: stats/yaml_extract
    test: start_time_stats
    property: stdout
    parameters:
      - JSONPath: $.min
      - data_type: number
      - stat: min
      - condition: '=='
  - name: fast_boot
    description: Boot time falls within the five-percentile threshold.
    check: stats/yaml_extract
    test: start_time_stats
    property: stdout
    parameters:
      - JSONPath: $.min
      - data_type: number
      - stat: p5
      - condition: '<='
rubrics:
  - name: vm_quality
    description: Overall VM quality from import and SSH checks.
    checks: [ova, ssh]
    calculation: weighted_avg
    parameters:
      - weights: [0.8, 0.2]
