apiVersion: vmactivity.example.com/v1
kind: AssessmentProject
metadata:
  name: example-vm-activity
spec:
  httpEndpoint:
    url: "http://127.0.0.1:8080/"
    trialPolicy:
      maxAttempts: 3
      timeout: 180s
  ssh:
    username: "tvadmin"
    secretRef:
      name: "ssh-secret"
      key: "ssh-key"
  testSettings:
    fixedPolicy: true
