schema_version: thot.dev/v4
project_id: ova-screening-archlinux-dualboot-libvirt
name: Arch Linux dualboot OVA libvirt screening
delivery_folder: deliveries
delivery_limits: {max_bytes: 21474836480} # Accept submissions up to 20 GiB.

sandbox_platforms:
  - id: ova-screening
    kind: kvm-alpine
    profile: alpine-ova
    resources:
      cpus: 4
      memory_mib: 6144
      disk_gib: 100
    preparation:
      timeout_seconds: 900
      packages:
        - bash
        - python3
        - dbus
        - dbus-openrc
        - polkit
        - polkit-openrc
        - libvirt
        - libvirt-client
        - libvirt-daemon
        - libvirt-daemon-openrc
        - libvirt-qemu
        - qemu-img
        - qemu-system-x86_64
        - ovmf
      scripts:
        - path: extern/preparation/install-libvirt.sh
          sha256: bf4f0518895e231bba301594a5e2739f2995f5976b42bb0d48c0bc732a902bbe
          timeout_seconds: 180
    tests:
      - id: libvirt-import-ova
        argv: [import_ova, archlinux-dualboot, /work/submission.ova, --max-vcpus, '2', --max-memory-mib, '2048']
        timeout_seconds: 3600
      - id: libvirt-start-vm
        requires: [libvirt-import-ova]
        argv: [start_vm, archlinux-dualboot]
        timeout_seconds: 180
      - id: libvirt-stop-vm
        requires: [libvirt-start-vm]
        argv: [stop_vm, archlinux-dualboot]
      - id: libvirt-destroy-vm
        requires: [libvirt-import-ova]
        argv: [destroy_vm, archlinux-dualboot]
    evaluation:
      import_check:
        tests: [libvirt-import-ova]
      lifecycle_check:
        tests: [libvirt-start-vm, libvirt-stop-vm, libvirt-destroy-vm]
      rubric:
        calculation: weighted_sum
        scale: 10
        criteria:
          - {check: import_check, points: 4}
          - {check: lifecycle_check, points: 6}
