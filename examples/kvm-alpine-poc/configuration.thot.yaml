schema_version: thot.dev/v2
project_id: kvm-alpine-poc-sum-two-integers
name: Alpine KVM quick viability check
language: en
students_file: students.yaml
assignments_file: assignments.yaml
delivery_folder: students

# Local kvm-alpine POC configuration. The dedicated POC CLI executes this fixture.
sandbox_platforms:
  - id: low-resource-alpine
    kind: kvm-alpine
    isolation_scope: kvm-guest
    lifecycle:
      template_name: thot-alpine-platform
      template_image:
        distribution: Alpine Linux
        release: 3.24.1
        architecture: x86_64
        image_url: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/generic_alpine-3.24.1-x86_64-bios-cloudinit-r0.qcow2
        sha512: 8d756f6fc7653daa4fb4e2e213d8a66007bcb1e5a846e28891af62c47b90685c694486c2746099ad99e9e8f5278db76b69d11dfe1e9361aa4c8406df16929a9c
      template_vm:
        vcpu: 1
        memory_mib: 512
        disk_gib: 2
        firmware: bios
      agent:
        install_from: pinned-static-binary
        version: "0.1.44"
        listen: guest-initiated-only
      project_clone:
        name: thot-alpine-poc-sum-project
        linked: true
        source_snapshot: prepared-baseline
      preparation:
        timeout_seconds: 180
        packages: [bash]
        scripts:
          - path: extern/preparation/verify-bash.sh
            sha256: f4c42a4ff86a913037fbf43346fe1418fd31081aeb56aab5527a3e7e8fa74226
            timeout_seconds: 30
      student_clone:
        name_prefix: thot-alpine-poc-student
        linked: true
        reset_from: prepared-baseline
        cleanup: always
    limits:
      vcpu: 1
      memory_mib: 512
      disk_gib: 2
      preparation_timeout_seconds: 180
      student_timeout_seconds: 30
      stdout_bytes: 4096
      stderr_bytes: 4096
    network:
      template_install: allow-configured-alpine-mirror-only
      preparation: allow-configured-alpine-mirror-only
      student_tests: deny
    inputs:
      - role: student-deliverable
        copy_to: /work/submission
        read_only: true
      - role: instructor-tests
        path: extern/tests
        copy_to: /work/instructor-tests
        read_only: true
    tests:
      - id: syntax
        action: exec
        argv: [sh, /work/instructor-tests/check-syntax.sh, /work/submission/sum.sh]
        timeout_seconds: 5
        expect_exit_code: 0
      - id: sum-result
        action: exec
        requires: [syntax]
        argv: [sh, /work/instructor-tests/check-sum.sh, /work/submission/sum.sh, "42"]
        timeout_seconds: 5
        capture: [stdout, stderr, exit_code, duration_ms]
        expect_exit_code: 0
        expected_stdout: "42\n"
        comparison: exact
      - id: portable-module-sum
        action: module
        requires: [syntax]
        module:
          runtime: posix-shell-script-v1
          manifest: extern/modules/sum-check/manifest.json
          package: extern/modules/sum-check/entrypoint.sh
        argv: [/work/submission/sum.sh, "42"]
        timeout_seconds: 5
        expect_exit_code: 0
        expected_stdout: "42\n"
        comparison: exact
    evaluation:
      syntax_check:
        tests: [syntax]
      functional_check:
        tests: [sum-result, portable-module-sum]
      rubric:
        calculation: weighted_sum
        scale: 10
        criteria:
          - {check: syntax_check, points: 2}
          - {check: functional_check, points: 8}
      infrastructure_errors:
        grade: pending
        never_convert_to_zero: true
