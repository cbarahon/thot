# KVM defaults. Project mappings override individual settings. Lists replace lists.
runtime:
  storage_root: /var/lib/libvirt/images/thot-alpine-poc
  host_command_timeout_seconds: 300
  agent_idle_seconds: 120
  guest_boot_timeout_seconds: 180
  transfer_timeout_seconds: 3600
platform:
  kind: kvm-alpine
  isolation_scope: kvm-guest
  lifecycle:
    template_image:
      distribution: Alpine Linux
      release: 3.24.1
      architecture: x86_64
      image_url: https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/generic_alpine-3.24.1-x86_64-bios-cloudinit-r0.qcow2
      sha512: 8d756f6fc7653daa4fb4e2e213d8a66007bcb1e5a846e28891af62c47b90685c694486c2746099ad99e9e8f5278db76b69d11dfe1e9361aa4c8406df16929a9c
    template_vm:
      vcpu: 1
      memory_mib: 512
      disk_gib: 4
      firmware: bios
    agent:
      install_from: pinned-static-binary
      version: installed
      listen: guest-initiated-only
    project_clone:
      linked: true
      source_snapshot: prepared-baseline
    preparation:
      timeout_seconds: 900
    student_clone:
      linked: true
      reset_from: prepared-baseline
      cleanup: always
  limits:
    student_timeout_seconds: 3600
    stdout_bytes: 16384
    stderr_bytes: 16384
  network:
    template_install: allow-configured-alpine-mirror-only
    preparation: allow-configured-alpine-mirror-only
    student_tests: deny
  inputs:
  - role: student-deliverable
    copy_to: /work/submission
    read_only: true
  evaluation:
    infrastructure_errors:
      grade: pending
      never_convert_to_zero: true
test:
  timeout_seconds: 60
  expect_exit_code: 0
  action: exec
profiles:
  alpine-ova:
    platform:
      lifecycle:
        template_vm:
          memory_mib: 1024
          disk_gib: 100
        preparation:
          timeout_seconds: 900
          packages:
          - bash
          - python3
          - dbus
          - dbus-openrc
          - polkit
          - polkit-openrc
          - libvirt
          - libvirt-client
          - libvirt-daemon
          - libvirt-daemon-openrc
          - libvirt-qemu
          - qemu-img
          - qemu-system-x86_64
          - ovmf
          scripts:
          - path: extern/preparation/install-libvirt.sh
            sha256: 744cc2fe2469e4c2eae5f3efff828fbde766968aa4df2e53aac9e904607730e1
            timeout_seconds: 180
      inputs:
      - role: student-deliverable
        copy_to: /work/submission.ova
    test:
      action: module
      module:
        runtime: posix-shell-script-v1
        manifest: extern/modules/libvirt-vm/manifest.json
        package: extern/modules/libvirt-vm/entrypoint.sh
